# Configuration for the Python side of the project. The scripts under `python/`
# are the source of truth for what runs inside the TrueForge sandbox; this file
# only configures how they are tested and linted locally.

[tool.pytest.ini_options]
# `python/` is not a package, and deliberately so: the sandbox runs these files
# as loose scripts, so they must be importable without any install step.
pythonpath = ["python"]
testpaths = ["tests/python"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101: pytest is built on assert, and the two production asserts are deliberate
# invariant checks whose failure must abort the run.
ignore = ["S101"]

[tool.ruff.lint.isort]
# The sandbox runs these as loose scripts, so they are imported by bare module
# name and ruff cannot infer that they are ours.
known-first-party = ["gen_data", "classify", "verify_scrub", "adjudicate", "scan_transcript"]

[tool.ruff.lint.per-file-ignores]
# The generator's use of `random` is for reproducible fake data, not for anything
# security-sensitive; the one value that must be unguessable uses `secrets`.
"python/gen_data.py" = ["S311"]
